<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#48176a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201e21" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="InventDB PMS — a modern property management system for landlords and property managers."
    />

    <!-- Brand mark: the PMS keystone. Drawn in Orbital Indigo (#48176a) rather
         than the asset's own accent, to match the in-app mark's brand colour. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='4 5 120 120'%3E%3Cpath d='M12 116 L12 54 L64 14 L116 54 L116 116' fill='none' stroke='%2348176a' stroke-width='13' stroke-linejoin='round' stroke-linecap='round'/%3E%3Crect x='48' y='78' width='32' height='38' rx='5' fill='%2348176a'/%3E%3C/svg%3E"
    />

    <!-- Poppins — the InventDB brand typeface.
         300 captions · 400 body · 500 subheads · 600/700 headings. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>InventDB PMS</title>

    <!-- Paint the stored theme before first render so dark users never see a
         white flash. ThemeContext reads whatever this leaves on <html>. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pms.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
