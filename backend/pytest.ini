[pytest]
testpaths = tests
pythonpath = .

# `xfail_strict` matters here: several tests document known defects with
# `@pytest.mark.xfail`. When somebody fixes one, the test starts passing and a
# strict xfail turns that XPASS into a failure — which is the prompt to delete
# the marker. Without it, fixed bugs quietly stay flagged as broken forever.
xfail_strict = true

addopts = -ra --strict-markers --strict-config

markers =
    contract: checks the API shape both the frontend and backend agree on.
    live: talks to a real InventDB instance; skipped unless credentials are set.
